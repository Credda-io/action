# Proves the whole install path from a real GitHub Actions runner.
#
# The endpoint can be shown to fail closed from anywhere -- an unsigned token,
# a junk bearer, no credentials at all. What cannot be shown from anywhere else
# is the SUCCESS path, because it needs an OIDC token that GitHub itself signed,
# and GitHub only signs one inside a workflow run. So this file exists to prove
# the one claim a laptop cannot: that a real runner in a public repository is
# served the engine, with no signup and no licence, and that the bytes it gets
# are the bytes engine.lock.json pins.
#
# It runs on a public repository, where Actions minutes are free.
name: smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  # The disclosed cost of this design. Without it GitHub mints no token and the
  # endpoint answers 401 naming this exact line.
  id-token: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request the engine with a real OIDC token
        run: |
          set -euo pipefail
          # These were ONE variable until the rename, because the audience and
          # the endpoint were the same string. They are no longer, and merging
          # them back would silently re-couple two things that now move on
          # different schedules.
          #
          # Both are READ FROM THE LAUNCHER, for the same reason VERSION is read
          # from the lockfile below: a literal here is a second place a
          # release-critical string lives, and it rots without anything going
          # red. It already had. This file asked GitHub to mint an audience of
          # `https://api.credda.io/v1/engine`, which
          # `ACCEPTED_ENGINE_AUDIENCES` in core has never contained -- it spans
          # `backend.credda.io` and `metering.codereef.app` -- and then POSTed
          # to that same string instead of to ENDPOINT, which it left unused. So
          # the one check that proves the success path could not pass, and the
          # only thing it could ever have reported was a failure of its own
          # making.
          AUD=$(node --input-type=module -e 'import {ENGINE_AUDIENCE} from "./launcher/fetch-engine.mjs"; process.stdout.write(ENGINE_AUDIENCE)')
          ENDPOINT=$(node --input-type=module -e 'import {DEFAULT_ENGINE_URL} from "./launcher/fetch-engine.mjs"; process.stdout.write(DEFAULT_ENGINE_URL)')
          echo "audience $AUD"
          echo "endpoint $ENDPOINT"
          # The version is READ FROM THE LOCKFILE rather than written here. A
          # literal in this file is a second place the release version lives,
          # and it silently rots the moment a release bumps the lockfile: the
          # endpoint happily serves the old artifact and the digest step below
          # then reports "R2 is not serving what the lockfile pins", which is a
          # true sentence about the wrong thing.
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("engine.lock.json","utf8")).version')
          echo "requesting engine $VERSION"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')

          CODE=$(curl -sS -o engine.tar.gz -w '%{http_code}' -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"version\":\"$VERSION\"}")
          echo "status $CODE"
          if [ "$CODE" != "200" ]; then cat engine.tar.gz; exit 1; fi

      - name: Verify the bytes against the committed lockfile
        run: |
          set -euo pipefail
          node -e '
            const {createHash}=require("node:crypto"), fs=require("node:fs");
            const lock=JSON.parse(fs.readFileSync("engine.lock.json","utf8"));
            const buf=fs.readFileSync("engine.tar.gz");
            const got=createHash("sha256").update(buf).digest("hex");
            console.log("expected", lock.archive.sha256, lock.archive.bytes);
            console.log("received", got, buf.length);
            if (got!==lock.archive.sha256 || buf.length!==lock.archive.bytes) {
              throw new Error("digest mismatch: R2 is not serving what the lockfile pins");
            }
            console.log("MATCH");
          '
